[package]
name = "aws-easy-sso"
version = "0.7.0"
description = "CLI tool to make AWS SSO more convenient."
authors = ["Martin Sturm", "Martin Sturm <noreply@martin-sturm.cloud>"]
edition = "2021"
license = "GPL-3.0-only"
homepage = "https://github.com/sturmm/aws-easy-sso"
repository = "https://github.com/sturmm/aws-easy-sso"
keywords = ["aws", "sso", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "aws-easy-sso-cli"
path = "src/main.rs"

[dependencies]
anyhow = "^1.0.79"
aws-config = { version = "1.1.2", features = ["behavior-version-latest"] }
aws-sdk-sso = "^1.84.0"
aws-sdk-ssooidc = "^1.85.0"
aws-types = "1.1.2"
base64 = "0.23.0"
chrono = "0.4.31"
clap = { version = "4.4.16", features = ["derive", "env"] }
directories = "6.0.0"
getrandom = "0.4.3"
httparse = "1.10.1"
inquire = "^0.7.5"
open = "5.0.1"
rust-ini = "0.21.3"
serde = { version = "1.0.195",  features = ["derive"] }
serde_json = "1.0.111"
sha1 = "0.10.6"
sha2 = "0.11.0"
tokio = { version = "1.35.1", features = ["full"] }
url = "2.5.8"

[dev-dependencies]
mockito = "1.4.0"
